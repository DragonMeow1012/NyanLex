plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Final jar name: mctranslator-<version>-Fabric-26.2.jar
tasks.named('jar') {
    archiveClassifier = "Fabric-${project.minecraft_version}"
    from('../LICENSE') {
        rename { 'LICENSE_MinecraftTranslator' }
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir '../src/main/java'
            exclude 'com/dragonmeow/mctranslator/fabric/**'
        }
    }
}

dependencies {
    // 26.x is unobfuscated: no 'mappings' line, Minecraft is declared directly.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    // Compile with a JDK 25 toolchain (MC 26.2 needs Java 25), so the Gradle-running JVM may differ.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    from('../src/main/resources/assets/mctranslator/lang') {
        into 'assets/mctranslator/lang'
    }
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
