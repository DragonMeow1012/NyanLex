plugins {
    id 'fabric-loom' version '1.7.4'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Final jar name: nyanlex-1.0.7-Fabric-1.21.1.jar (mirrors the NeoForge classifier scheme).
tasks.named('remapJar') {
    archiveClassifier = 'Fabric-1.21.1'
}

tasks.named('jar') {
    // Author-only tooling (translation-hub export) never ships inside the mod jar.
    exclude 'com/dragonmeow/nyanlex/hub/tool/**'
    from('LICENSE') {
        rename { 'LICENSE_NyanLex' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // Minecraft + mappings + loader. Use OFFICIAL MOJANG mappings (same net.minecraft.* names as
    // the NeoForge build) so the mixins / FabricTextStyle / config screens are shared verbatim.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (provides ClientReceiveMessageEvents, KeyBindingHelper, ClientTickEvents, ...)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Gson is bundled with Minecraft at runtime; declared here only so the
    // Minecraft-free unit tests can run without Loom/Minecraft on the classpath.
    testImplementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // Minecraft 1.21.1 requires Java 21. Loom provisions a matching JDK via toolchains.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Author-only: export validated AI-cache rows into translation-hub/ repository files.
// See com.dragonmeow.nyanlex.hub.tool.HubExportTool for the full flag reference. Example:
//   gradle hubExport -PcacheDir="C:\Users\me\AppData\Roaming\.minecraft\config" -Plang=zh-TW \
//           -Pserver=hypixel.net -Pout=translation-hub -PmergeIndex -PdropChat
tasks.register('hubExport', JavaExec) {
    group = 'translation hub'
    description = 'Author-only: export validated AI-cache rows into translation-hub/ repository files.'
    mainClass = 'com.dragonmeow.nyanlex.hub.tool.HubExportTool'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8']
    doFirst {
        List<String> cliArgs = []
        if (project.hasProperty('cacheDir')) cliArgs += ['--cache-dir', project.property('cacheDir').toString()]
        if (project.hasProperty('lang')) cliArgs += ['--lang', project.property('lang').toString()]
        if (project.hasProperty('server')) cliArgs += ['--server', project.property('server').toString()]
        if (project.hasProperty('modpack')) cliArgs += ['--modpack', project.property('modpack').toString()]
        if (project.hasProperty('mod')) cliArgs += ['--mod', project.property('mod').toString()]
        if (project.hasProperty('out')) cliArgs += ['--out', project.property('out').toString()]
        if (project.hasProperty('mergeIndex')) cliArgs += ['--merge-index']
        if (project.hasProperty('dropChat')) cliArgs += ['--drop-chat']
        if (project.hasProperty('maxRows')) cliArgs += ['--max-rows', project.property('maxRows').toString()]
        args = cliArgs
    }
}
