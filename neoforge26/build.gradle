plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'nyanlex' }

tasks.named('jar') {
    // Folders of the earlier project names can linger (empty) in a working copy; none of them may reach a release jar.
    exclude 'assets/nyanslate/**', 'assets/mctranslator/**'
    archiveClassifier = 'NeoForge-26.2'
    from('../LICENSE') {
        rename { 'LICENSE_NyanLex' }
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version
    mods {
        nyanlex {
            sourceSet sourceSets.main
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', project.minecraft_range
    inputs.property 'neoforge_range', project.neoforge_range
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version, 'minecraft_range': project.minecraft_range, 'neoforge_range': project.neoforge_range
    }
}

sourceSets.main.java.srcDir("../platform26/src/main/java")
