modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mixins]]
config = "mctranslator.neoforge26.mixins.json"

[[mods]]
modId = "mctranslator"
version = "${version}"
displayName = "Minecraft Translator"
description = "Client-side translation into multiple target languages with OpenAI-compatible AI or Google, Youdao, DeepL, and Microsoft machine translation."
authors = "DragonMeow"
# Client-only QoL mod: do not block joining servers that don't have it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.mctranslator]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mctranslator]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "CLIENT"
