modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mixins]]
config = "nyanslate.neoforge26.mixins.json"

[[mods]]
logoFile="icon.png"
modId = "nyanslate"
version = "${version}"
displayName = "Nyanslate"
description = "Client-side translation into multiple target languages with OpenAI-compatible AI or Google, Youdao, DeepL, and Microsoft machine translation."
authors = "DragonMeow"
# Client-only QoL mod: do not block joining servers that don't have it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.nyanslate]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.nyanslate]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "CLIENT"
