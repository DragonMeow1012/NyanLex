modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mixins]]
config = "nyanlex.neoforge26.mixins.json"

[[mods]]
iconFile="icon.png"
modId = "nyanlex"
version = "${version}"
displayName = "NyanLex Translator"
description = "Client-side translation into multiple target languages with OpenAI-compatible AI or machine translation (an unofficial Google endpoint). Unofficial: not affiliated with or endorsed by Mojang, Microsoft, Hypixel or any mod author."
authors = "DragonMeow"
# Client-only QoL mod: do not block joining servers that don't have it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.nyanlex]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.nyanlex]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "CLIENT"
