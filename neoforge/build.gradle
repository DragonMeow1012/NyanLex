plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'nyanlex' }

// Final jar name: nyanlex-1.0.7-NeoForge-1.21.1.jar (name-version-loader-mcversion)
tasks.named('jar') {
    // Folders of the earlier project names can linger (empty) in a working copy; none of them may reach a release jar.
    exclude 'assets/nyanslate/**', 'assets/mctranslator/**'
    archiveClassifier = 'NeoForge-1.21.1'
    from('../LICENSE') {
        rename { 'LICENSE_NyanLex' }
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
    }

    mods {
        nyanlex {
            sourceSet sourceSets.main
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}
