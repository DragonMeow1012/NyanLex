modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mixins]]
config = "mctranslator.neoforge.mixins.json"

[[mods]]
modId = "mctranslator"
version = "${version}"
displayName = "Minecraft Translator"
description = "Translates chat and item names/lore into Traditional Chinese using Google Translate. Client-only."
authors = "DragonMeow"
# Client-only QoL mod: do not block joining servers that don't have it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.mctranslator]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.mctranslator]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "CLIENT"
