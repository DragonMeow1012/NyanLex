plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'java'
}
version = project.mod_version
group = project.maven_group
base { archivesName = 'NyanLex-Translator' }

// NeoForge 1.20.1 is the Forge 47.1 line: the game runs with SRG names (m_123_ / f_123_), so
//  * the finished jar is re-obfuscated by reobfJar (every reference to Minecraft / Forge members), and
//  * the Mixin annotation processor writes a refmap that maps the mixins' Mojang-named targets to SRG,
//  * Forge only loads mixin configs that the jar manifest lists in MixinConfigs (mods.toml is not read for them).
def mixinConfigs = ['nyanlex.neoforge.mixins.json', 'nyanlex.neoforge.compat.mixins.json']
def mixinRefmap = 'nyanlex.neoforge.refmap.json'

tasks.named('jar') {
    // Folders of the earlier project names can linger (empty) in a working copy; none of them may reach a release jar.
    exclude 'assets/nyanslate/**', 'assets/mctranslator/**'
    archiveClassifier = 'NeoForge-1.20.1'
    from('../LICENSE') { rename { 'LICENSE_NyanLex' } }
    manifest {
        attributes 'MixinConfigs': mixinConfigs.join(',')
    }
    finalizedBy 'reobfJar'
}

java {
    // Minecraft 1.20.1 targets Java 17; ForgeGradle's setup tasks need a JDK 17 toolchain.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                nyanlex {
                    source sourceSets.main
                }
            }
        }
        client {
        }
    }
}

mixin {
    add sourceSets.main, mixinRefmap
    mixinConfigs.each { config it }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    minecraft "net.neoforged:forge:${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}
