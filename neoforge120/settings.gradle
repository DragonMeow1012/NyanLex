pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = "https://maven.neoforged.net/releases" }
        mavenCentral()
    }
}

// Auto-provision JDKs by toolchain version (NeoForge 1.20.1's neoFormRecompile requires JDK 17,
// which isn't installed here — this lets Gradle download it).
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = "mctranslator-neoforge120"
