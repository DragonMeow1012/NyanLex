plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.mod_version
group = project.maven_group
base { archivesName = 'mctranslator' }

tasks.named('jar') {
    archiveClassifier = 'NeoForge-26.3'
    from('../LICENSE') {
        rename { 'LICENSE_MinecraftTranslator' }
    }
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version
    mods {
        mctranslator {
            sourceSet sourceSets.main
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', project.minecraft_range
    inputs.property 'neoforge_range', project.neoforge_range
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version, 'minecraft_range': project.minecraft_range, 'neoforge_range': project.neoforge_range
    }
}

// Share translation and loader code; browser integration follows the target API.
sourceSets.main {
    java.setSrcDirs(['../neoforge26/src/main/java', '../platform263/src/main/java'])
    resources.setSrcDirs(['../neoforge26/src/main/resources'])
}
