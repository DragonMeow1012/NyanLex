org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft 26.3 (unobfuscated — official Mojang names, no Yarn). Java 25.
minecraft_version=26.3
# Compile against the OLDEST Loader the jar supports, not the newest. Loader 0.19.4 and later ship
# sponge-mixin 0.17.4+, whose injector annotations declare at()/slice() as arrays; a jar compiled
# against it stores them as arrays, and MixinExtras 0.5.4 (inside Loader 0.19.3 and 0.19.4) casts a
# Redirect's "at" to a single annotation, so such a jar crashes there with a ClassCastException.
# Built against 0.19.3 (sponge-mixin 0.17.3) the same jar runs on 0.19.3 and every later Loader.
loader_version=0.19.3
fabric_api_version=0.161.0+26.3
loom_version=1.17.21

mod_version=1.0.1
maven_group=com.dragonmeow.nyanlex
archives_base_name=NyanLex-Translator
