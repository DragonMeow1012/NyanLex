plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Final jar name: NyanLex-Translator-1.0.1-Fabric-26.3.jar (name-version-loader-mcversion)
tasks.named('jar') {
    // Folders of the earlier project names can linger (empty) in a working copy; none of them may reach a release jar.
    exclude 'assets/nyanslate/**', 'assets/mctranslator/**'
    archiveClassifier = "Fabric-${project.minecraft_version}"
    from('../LICENSE') {
        rename { 'LICENSE_NyanLex' }
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // 26.x is unobfuscated: no 'mappings' line, Minecraft is declared directly.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    // Compile with a JDK 25 toolchain (MC 26.3 needs Java 25), so the Gradle-running JVM may differ.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

// Share translation and loader code; browser integration follows the target API.
sourceSets.main {
    // 'src/main/java' holds the few classes that must differ from the 26.2 tree. 26.3 moved the
    // GpuTextureView type to another package and a Mixin accessor has to match the field's exact
    // type, so BakedSheetGlyphAccessor has its own copy there; the 26.2 one is left out.
    java.setSrcDirs(['../fabric26/src/main/java', '../platform263/src/main/java', 'src/main/java'])
    java.exclude { element ->
        element.file.toString().replace('\\', '/').contains('/fabric26/src/main/java/')
                && element.name == 'BakedSheetGlyphAccessor.java'
    }
    resources.setSrcDirs(['../fabric26/src/main/resources'])
}
