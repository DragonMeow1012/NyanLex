plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Final jar name: mctranslator-1.0.5-Fabric-26.3.jar (name-version-loader-mcversion)
tasks.named('jar') {
    archiveClassifier = "Fabric-${project.minecraft_version}"
    from('../LICENSE') {
        rename { 'LICENSE_MinecraftTranslator' }
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    // 26.x is unobfuscated: no 'mappings' line, Minecraft is declared directly.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    // Compile with a JDK 25 toolchain (MC 26.3 needs Java 25), so the Gradle-running JVM may differ.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version
    }
}

// Share translation and loader code; browser integration follows the target API.
sourceSets.main {
    java.setSrcDirs(['../fabric26/src/main/java', '../platform263/src/main/java'])
    resources.setSrcDirs(['../fabric26/src/main/resources'])
}
